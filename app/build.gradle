plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version libs.versions.spring.boot
    id 'io.spring.dependency-management' version libs.versions.spring.dependency.management
}


repositories {
    mavenCentral()
}

dependencies {

    implementation libs.guava
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.data.jpa

    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    runtimeOnly libs.h2

    testImplementation libs.spring.boot.starter.test
    testImplementation libs.junit.jupiter
}


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}


springBoot {
    mainClass = 'com.ecommerce.ECommerceApp'
}

tasks.named('bootRun') {
    doFirst {
        jvmArgs = ["-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005"]
    }
}

tasks.withType(JavaCompile) {
    options.annotationProcessorPath = configurations.annotationProcessor
}